<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RAG System - Ask questions about your documents">
  <title>RAG System</title>
  <style>
    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #333;
      background: #f5f5f5;
    }

    /* Main layout */
    .app-container {
      display: grid;
      grid-template-columns: 300px 1fr auto;
      height: 100vh;
      max-width: 1800px;
      margin: 0 auto;
      background: white;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    /* Sidebar */
    #sidebar {
      background: #2c3e50;
      color: white;
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid #34495e;
    }

    #sidebar-header h1 {
      font-size: 20px;
      margin-bottom: 30px;
      color: #ecf0f1;
    }

    #sidebar h2 {
      font-size: 14px;
      text-transform: uppercase;
      margin: 20px 0 10px;
      color: #95a5a6;
      font-weight: 600;
    }

    #collections-list {
      margin-bottom: 15px;
    }

    .collection-item {
      padding: 10px;
      margin: 5px 0;
      background: #34495e;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .collection-item:hover {
      background: #3d566e;
    }

    .collection-item.active {
      background: #3498db;
      font-weight: 600;
    }

    .collection-name {
      font-weight: 500;
    }

    .collection-meta {
      font-size: 12px;
      color: #95a5a6;
      margin-top: 4px;
    }

    .collection-actions {
      margin-top: 8px;
      display: flex;
      gap: 5px;
    }

    .collection-delete-btn {
      background: #e74c3c;
      padding: 4px 10px;
      font-size: 12px;
      margin: 0;
      width: auto;
    }

    .collection-delete-btn:hover {
      background: #c0392b;
    }

    .collection-delete-btn:disabled {
      background: #95a5a6;
      cursor: not-allowed;
    }

    #upload-zone {
      border: 2px dashed #7f8c8d;
      border-radius: 8px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin: 15px 0;
    }

    #upload-zone:hover, #upload-zone.drag-over {
      border-color: #3498db;
      background: rgba(52, 152, 219, 0.1);
    }

    #upload-zone p {
      margin: 5px 0;
      color: #95a5a6;
    }

    button {
      background: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
      width: 100%;
      margin: 5px 0;
    }

    button:hover {
      background: #2980b9;
    }

    button:disabled {
      background: #95a5a6;
      cursor: not-allowed;
    }

    #progress-container {
      margin: 20px 0;
      padding: 15px;
      background: #34495e;
      border-radius: 8px;
    }

    #progress-bar-bg {
      width: 100%;
      height: 20px;
      background: #2c3e50;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    #progress-bar {
      height: 100%;
      background: #3498db;
      width: 0%;
      transition: width 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }

    #progress-message {
      font-size: 12px;
      color: #ecf0f1;
      text-align: center;
    }

    /* Chat area */
    #chat-area {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #ecf0f1;
    }

    #chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    #chat-header button {
      width: auto;
      margin: 0 0 0 10px;
    }

    #message-list {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin: 15px 0;
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 80%;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      background: #3498db;
      color: white;
      margin-left: auto;
      text-align: right;
    }

    .message.assistant {
      background: white;
      border: 1px solid #ddd;
    }

    .message.loading {
      background: #f8f9fa;
      font-style: italic;
      color: #666;
    }

    .message.error {
      background: #e74c3c;
      color: white;
    }

    #chat-input-area {
      padding: 20px;
      background: white;
      border-top: 1px solid #ddd;
    }

    #chat-form {
      display: flex;
      gap: 10px;
    }

    #question-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }

    #question-input:focus {
      outline: none;
      border-color: #3498db;
    }

    #send-btn {
      width: auto;
      padding: 12px 30px;
      margin: 0;
    }

    /* Settings panel */
    #settings-panel {
      width: 350px;
      background: white;
      border-left: 1px solid #ddd;
      padding: 20px;
      overflow-y: auto;
      transition: transform 0.3s;
    }

    #settings-panel.hidden {
      transform: translateX(100%);
      position: absolute;
      right: 0;
      top: 0;
      height: 100vh;
    }

    #settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }

    #close-settings-btn {
      width: auto;
      padding: 5px 15px;
      background: #e74c3c;
      margin: 0;
    }

    .setting-group {
      margin-bottom: 20px;
    }

    .setting-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      color: #2c3e50;
    }

    .setting-group input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    .setting-group input:focus {
      outline: none;
      border-color: #3498db;
    }

    .setting-help {
      display: block;
      font-size: 12px;
      color: #7f8c8d;
      margin-top: 4px;
    }

    .setting-error {
      display: block;
      font-size: 12px;
      color: #e74c3c;
      margin-top: 4px;
      display: none;
    }

    .setting-error.visible {
      display: block;
    }

    .settings-error {
      color: #e74c3c;
      font-size: 14px;
      margin-bottom: 15px;
      padding: 10px;
      background: #fdeaea;
      border-radius: 4px;
      display: none;
    }

    .settings-error.visible {
      display: block;
    }

    .settings-success {
      color: #27ae60;
      font-size: 14px;
      margin-bottom: 15px;
      padding: 10px;
      background: #eafaf1;
      border-radius: 4px;
      display: none;
    }

    .settings-success.visible {
      display: block;
    }

    .settings-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 30px;
    }

    #selected-files-list {
      margin: 10px 0;
      font-size: 12px;
    }

    .file-item {
      padding: 5px 10px;
      background: #34495e;
      margin: 3px 0;
      border-radius: 3px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .file-item .remove-btn {
      background: #e74c3c;
      width: auto;
      padding: 2px 8px;
      font-size: 12px;
      margin: 0;
    }

    /* Utility classes */
    .hidden {
      display: none !important;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <noscript>This application requires JavaScript to be enabled.</noscript>

  <div class="app-container">
    <!-- Sidebar: collections + upload + progress -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <h1>RAG System</h1>
      </div>

      <!-- Collections section -->
      <div id="collections-section">
        <h2>Collections</h2>
        <div id="collections-list">
          <!-- Task 9.1: collection items rendered here -->
        </div>
        <button id="refresh-collections-btn" type="button">Refresh</button>
      </div>

      <!-- Upload section -->
      <div id="upload-section">
        <h2>Upload Documents</h2>
        <div id="upload-zone">
          <!-- Task 10.1: drag-and-drop zone -->
          <p>Drag and drop PDF files here</p>
          <p>or</p>
          <button id="file-select-btn" type="button">Select Files</button>
          <input type="file" id="file-input" multiple accept=".pdf" style="display: none;">
        </div>
        <div id="selected-files-list">
          <!-- Task 10.3: selected files list -->
        </div>
        <button id="upload-btn" type="button">Upload</button>
        <button id="index-btn" type="button">Index Documents</button>
      </div>

      <!-- Progress section -->
      <div id="progress-container" style="display: none;">
        <div id="progress-bar-bg">
          <div id="progress-bar"></div>
        </div>
        <div id="progress-message"></div>
      </div>
    </aside>

    <!-- Main chat area -->
    <main id="chat-area">
      <div id="chat-header">
        <div id="active-collection-display">Collection: <span id="active-collection-name">default</span></div>
        <button id="clear-conversation-btn" type="button">Clear Conversation</button>
        <button id="settings-toggle-btn" type="button">Settings</button>
      </div>

      <div id="message-list">
        <!-- Task 9.3: chat messages rendered here -->
      </div>

      <div id="chat-input-area">
        <form id="chat-form">
          <input type="text" id="question-input" placeholder="Ask a question about your documents..." autocomplete="off">
          <button id="send-btn" type="submit">Send</button>
        </form>
      </div>
    </main>

    <!-- Settings panel (collapsible) -->
    <section id="settings-panel" class="hidden">
      <div id="settings-header">
        <h2>Settings</h2>
        <button id="close-settings-btn" type="button">×</button>
      </div>

      <div id="settings-error-message" class="settings-error"></div>
      <div id="settings-success-message" class="settings-success"></div>

      <form id="settings-form">
        <div class="setting-group">
          <label for="chunk-size-input">Chunk Size</label>
          <input type="number" id="chunk-size-input" min="100" max="2000">
          <span class="setting-help">Text chunk size for indexing (100-2000)</span>
          <span id="chunk-size-error" class="setting-error"></span>
        </div>

        <div class="setting-group">
          <label for="chunk-overlap-input">Chunk Overlap</label>
          <input type="number" id="chunk-overlap-input" min="0">
          <span class="setting-help">Overlap between chunks (0 to chunk size)</span>
          <span id="chunk-overlap-error" class="setting-error"></span>
        </div>

        <div class="setting-group">
          <label for="top-k-input">Top K</label>
          <input type="number" id="top-k-input" min="1" max="20">
          <span class="setting-help">Number of chunks to retrieve (1-20)</span>
          <span id="top-k-error" class="setting-error"></span>
        </div>

        <div class="setting-group">
          <label for="temperature-input">Temperature</label>
          <input type="number" id="temperature-input" min="0" max="1" step="0.1">
          <span class="setting-help">LLM creativity (0.0-1.0)</span>
          <span id="temperature-error" class="setting-error"></span>
        </div>

        <div class="setting-group">
          <label for="max-tokens-input">Max Tokens</label>
          <input type="number" id="max-tokens-input" min="100" max="8192">
          <span class="setting-help">Maximum response length (100-8192)</span>
          <span id="max-tokens-error" class="setting-error"></span>
        </div>

        <div class="settings-actions">
          <button id="save-settings-btn" type="button">Save Settings</button>
          <button id="reset-settings-btn" type="button">Reset to Defaults</button>
        </div>
      </form>
    </section>
  </div>

  <script>
    // Global state
    let activeCollection = localStorage.getItem('activeCollection') || 'default';
    let selectedFiles = [];

    // DOM elements
    const collectionsList = document.getElementById('collections-list');
    const activeCollectionName = document.getElementById('active-collection-name');
    const messageList = document.getElementById('message-list');
    const chatForm = document.getElementById('chat-form');
    const questionInput = document.getElementById('question-input');
    const sendBtn = document.getElementById('send-btn');
    const clearConversationBtn = document.getElementById('clear-conversation-btn');
    const refreshCollectionsBtn = document.getElementById('refresh-collections-btn');

    // Collections management
    async function loadCollections() {
      try {
        const response = await fetch('/api/collections');
        const collections = await response.json();

        if (!Array.isArray(collections)) {
          console.error('Invalid collections response:', collections);
          return;
        }

        collectionsList.innerHTML = '';

        if (collections.length === 0) {
          collectionsList.innerHTML = '<div style="color: #95a5a6; padding: 10px;">No collections yet</div>';
          return;
        }

        collections.forEach(collection => {
          const item = document.createElement('div');
          item.className = 'collection-item';
          if (collection.name === activeCollection) {
            item.classList.add('active');
          }

          const isActive = collection.name === activeCollection;

          item.innerHTML = `
            <div class="collection-name">${collection.name}</div>
            <div class="collection-meta">${collection.embeddings} embeddings, ${collection.chunks} chunks</div>
            <div class="collection-actions">
              <button class="collection-delete-btn" data-collection="${collection.name}" ${isActive ? 'disabled' : ''}>
                ${isActive ? 'Active' : 'Delete'}
              </button>
            </div>
          `;

          // Click on collection name/meta to select
          const nameDiv = item.querySelector('.collection-name');
          const metaDiv = item.querySelector('.collection-meta');
          nameDiv.addEventListener('click', () => selectCollection(collection.name));
          metaDiv.addEventListener('click', () => selectCollection(collection.name));

          // Delete button handler
          const deleteBtn = item.querySelector('.collection-delete-btn');
          deleteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            deleteCollection(collection.name);
          });

          collectionsList.appendChild(item);
        });

        activeCollectionName.textContent = activeCollection;
      } catch (error) {
        console.error('Failed to load collections:', error);
        collectionsList.innerHTML = '<div style="color: #e74c3c; padding: 10px;">Failed to load collections</div>';
      }
    }

    function selectCollection(name) {
      activeCollection = name;
      localStorage.setItem('activeCollection', name);
      activeCollectionName.textContent = name;

      // Update active state in UI
      document.querySelectorAll('.collection-item').forEach(item => {
        item.classList.remove('active');
        if (item.querySelector('.collection-name').textContent === name) {
          item.classList.add('active');
        }
      });

      // Clear conversation when switching collections
      messageList.innerHTML = '';
    }

    // Task 13.1, 13.2, 13.3: Delete collection with confirmation and active collection check
    async function deleteCollection(name) {
      // Task 13.3: Prevent deleting active collection
      if (name === activeCollection) {
        alert('Cannot delete the active collection. Please switch to another collection first.');
        return;
      }

      // Task 13.1: Confirmation dialog
      if (!confirm(`Delete collection "${name}"? This will permanently remove all embeddings and chunk data.`)) {
        return;
      }

      try {
        // Task 13.2: DELETE request
        const response = await fetch(`/api/collections/${encodeURIComponent(name)}`, {
          method: 'DELETE'
        });

        if (!response.ok) {
          const error = await response.json();
          alert(`Failed to delete collection: ${error.error || 'Unknown error'}`);
          return;
        }

        // Task 13.2: Refresh UI after successful deletion
        await loadCollections();
      } catch (error) {
        console.error('Failed to delete collection:', error);
        alert(`Error deleting collection: ${error.message}`);
      }
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      loadCollections();
    });

    // Refresh button
    refreshCollectionsBtn.addEventListener('click', loadCollections);

    // Chat interface
    function appendMessage(text, type) {
      const message = document.createElement('div');
      message.className = `message ${type}`;
      message.textContent = text;
      messageList.appendChild(message);
      scrollToBottom();
    }

    function scrollToBottom() {
      messageList.scrollTop = messageList.scrollHeight;
    }

    function setFormDisabled(disabled) {
      questionInput.disabled = disabled;
      sendBtn.disabled = disabled;
    }

    // Chat form submission
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const question = questionInput.value.trim();
      if (!question) return;

      // Display user message
      appendMessage(question, 'user');
      questionInput.value = '';

      // Show loading state
      const loadingMsg = document.createElement('div');
      loadingMsg.className = 'message loading';
      loadingMsg.textContent = 'Thinking...';
      messageList.appendChild(loadingMsg);
      scrollToBottom();

      setFormDisabled(true);

      try {
        const response = await fetch(`/api/collections/${encodeURIComponent(activeCollection)}/query`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });

        // Remove loading message
        loadingMsg.remove();

        if (!response.ok) {
          const error = await response.json();
          appendMessage(`Error: ${error.error || 'Query failed'}`, 'error');
          return;
        }

        const data = await response.json();
        appendMessage(data.answer, 'assistant');
      } catch (error) {
        loadingMsg.remove();
        appendMessage(`Network error: ${error.message}`, 'error');
      } finally {
        setFormDisabled(false);
        questionInput.focus();
      }
    });

    // Clear conversation button
    clearConversationBtn.addEventListener('click', () => {
      if (confirm('Clear all messages from this conversation?')) {
        messageList.innerHTML = '';
      }
    });

    // File upload functionality
    const uploadZone = document.getElementById('upload-zone');
    const fileInput = document.getElementById('file-input');
    const fileSelectBtn = document.getElementById('file-select-btn');
    const selectedFilesList = document.getElementById('selected-files-list');
    const uploadBtn = document.getElementById('upload-btn');
    const indexBtn = document.getElementById('index-btn');

    let dragCounter = 0;

    // Drag and drop handlers
    uploadZone.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      uploadZone.classList.add('drag-over');
    });

    uploadZone.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter === 0) {
        uploadZone.classList.remove('drag-over');
      }
    });

    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
    });

    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      uploadZone.classList.remove('drag-over');

      const files = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.pdf'));
      if (files.length === 0) {
        alert('Please drop only PDF files');
        return;
      }

      selectedFiles = files;
      displaySelectedFiles();
    });

    // File select button
    fileSelectBtn.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      selectedFiles = Array.from(e.target.files);
      displaySelectedFiles();
    });

    function displaySelectedFiles() {
      if (selectedFiles.length === 0) {
        selectedFilesList.innerHTML = '';
        return;
      }

      selectedFilesList.innerHTML = '<strong>Selected files:</strong>';
      selectedFiles.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `
          <span>${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)</span>
          <button class="remove-btn" onclick="removeFile(${index})">Remove</button>
        `;
        selectedFilesList.appendChild(item);
      });
    }

    window.removeFile = function(index) {
      selectedFiles.splice(index, 1);
      displaySelectedFiles();
    };

    // Upload files
    uploadBtn.addEventListener('click', async () => {
      if (selectedFiles.length === 0) {
        alert('Please select files to upload');
        return;
      }

      const formData = new FormData();
      selectedFiles.forEach(file => {
        formData.append('files', file);
      });

      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Uploading...';

      try {
        const response = await fetch(`/api/collections/${encodeURIComponent(activeCollection)}/upload`, {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          const error = await response.json();
          alert(`Upload failed: ${error.error || 'Unknown error'}`);
          return;
        }

        const result = await response.json();
        alert(`Successfully uploaded ${result.count} file(s)`);

        // Clear selection
        selectedFiles = [];
        fileInput.value = '';
        displaySelectedFiles();
      } catch (error) {
        alert(`Upload error: ${error.message}`);
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Upload';
      }
    });

    // Indexing with SSE progress
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const progressMessage = document.getElementById('progress-message');

    indexBtn.addEventListener('click', async () => {
      // Show progress container
      progressContainer.style.display = 'block';
      progressBar.style.width = '0%';
      progressBar.textContent = '0%';
      progressMessage.textContent = 'Starting indexing...';

      // Disable buttons during indexing
      indexBtn.disabled = true;
      uploadBtn.disabled = true;

      try {
        const response = await fetch(`/api/collections/${encodeURIComponent(activeCollection)}/index`, {
          method: 'POST'
        });

        if (!response.ok) {
          throw new Error('Failed to start indexing');
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();

          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (!line.trim() || !line.startsWith('data: ')) continue;

            try {
              const eventData = JSON.parse(line.substring(6));
              handleIndexingEvent(eventData);
            } catch (e) {
              console.error('Failed to parse SSE event:', e);
            }
          }
        }
      } catch (error) {
        progressMessage.textContent = `Error: ${error.message}`;
        progressBar.style.backgroundColor = '#e74c3c';
      } finally {
        indexBtn.disabled = false;
        uploadBtn.disabled = false;
      }
    });

    function handleIndexingEvent(data) {
      switch (data.type) {
        case 'start':
        case 'info':
          progressMessage.textContent = data.message;
          break;

        case 'progress':
          const percentage = data.percentage || 0;
          progressBar.style.width = `${percentage}%`;
          progressBar.textContent = `${percentage}%`;
          progressMessage.textContent = data.message;
          break;

        case 'complete':
          progressBar.style.width = '100%';
          progressBar.textContent = '100%';
          progressBar.style.backgroundColor = '#27ae60';
          progressMessage.textContent = data.message;

          // Refresh collections list to show updated counts
          setTimeout(() => {
            loadCollections();
            // Hide progress after 3 seconds
            setTimeout(() => {
              progressContainer.style.display = 'none';
              progressBar.style.backgroundColor = '#3498db';
            }, 3000);
          }, 1000);
          break;

        case 'error':
          progressBar.style.backgroundColor = '#e74c3c';
          progressMessage.textContent = `Error: ${data.message}`;
          break;
      }
    }

    // Settings panel functionality
    const settingsPanel = document.getElementById('settings-panel');
    const settingsToggleBtn = document.getElementById('settings-toggle-btn');
    const closeSettingsBtn = document.getElementById('close-settings-btn');
    const saveSettingsBtn = document.getElementById('save-settings-btn');
    const resetSettingsBtn = document.getElementById('reset-settings-btn');

    // Settings input elements
    const chunkSizeInput = document.getElementById('chunk-size-input');
    const chunkOverlapInput = document.getElementById('chunk-overlap-input');
    const topKInput = document.getElementById('top-k-input');
    const temperatureInput = document.getElementById('temperature-input');
    const maxTokensInput = document.getElementById('max-tokens-input');

    // Error elements
    const settingsErrorMessage = document.getElementById('settings-error-message');
    const settingsSuccessMessage = document.getElementById('settings-success-message');
    const chunkSizeError = document.getElementById('chunk-size-error');
    const chunkOverlapError = document.getElementById('chunk-overlap-error');
    const topKError = document.getElementById('top-k-error');
    const temperatureError = document.getElementById('temperature-error');
    const maxTokensError = document.getElementById('max-tokens-error');

    // Validation constraints (from server-side validation)
    const SETTINGS_CONSTRAINTS = {
      chunkSize: { min: 100, max: 2000 },
      chunkOverlap: { min: 0 },
      topK: { min: 1, max: 20 },
      temperature: { min: 0.0, max: 1.0 },
      maxTokens: { min: 100, max: 8192 }
    };

    // Default values
    const DEFAULT_SETTINGS = {
      chunkSize: 500,
      chunkOverlap: 50,
      topK: 3,
      temperature: 0.7,
      maxTokens: 2048
    };

    // Task 12.1: Toggle settings panel
    function toggleSettingsPanel() {
      const isHidden = settingsPanel.classList.contains('hidden');

      if (isHidden) {
        settingsPanel.classList.remove('hidden');
        loadSettings(); // Task 12.2: Load settings when opening
      } else {
        settingsPanel.classList.add('hidden');
        clearMessages();
      }
    }

    settingsToggleBtn.addEventListener('click', toggleSettingsPanel);
    closeSettingsBtn.addEventListener('click', () => {
      settingsPanel.classList.add('hidden');
      clearMessages();
    });

    function clearMessages() {
      settingsErrorMessage.classList.remove('visible');
      settingsSuccessMessage.classList.remove('visible');
      clearFieldErrors();
    }

    function clearFieldErrors() {
      chunkSizeError.classList.remove('visible');
      chunkOverlapError.classList.remove('visible');
      topKError.classList.remove('visible');
      temperatureError.classList.remove('visible');
      maxTokensError.classList.remove('visible');
    }

    // Task 12.2: Load settings from API
    async function loadSettings() {
      clearMessages();

      try {
        const response = await fetch('/api/settings');

        if (!response.ok) {
          throw new Error(`Failed to load settings (${response.status})`);
        }

        const data = await response.json();

        // Populate input fields
        chunkSizeInput.value = data.chunkSize;
        chunkOverlapInput.value = data.chunkOverlap;
        topKInput.value = data.topK;
        temperatureInput.value = data.temperature;
        maxTokensInput.value = data.maxTokens;
      } catch (error) {
        console.error('Failed to load settings:', error);
        settingsErrorMessage.textContent = 'Could not load settings. Check that the server is running.';
        settingsErrorMessage.classList.add('visible');
      }
    }

    // Task 12.4: Real-time validation feedback
    function validateField(field, value) {
      const numValue = parseFloat(value);

      switch (field) {
        case 'chunkSize':
          if (isNaN(numValue) || !Number.isInteger(numValue)) {
            return 'Must be an integer';
          }
          if (numValue < SETTINGS_CONSTRAINTS.chunkSize.min || numValue > SETTINGS_CONSTRAINTS.chunkSize.max) {
            return `Must be between ${SETTINGS_CONSTRAINTS.chunkSize.min} and ${SETTINGS_CONSTRAINTS.chunkSize.max}`;
          }
          break;

        case 'chunkOverlap':
          if (isNaN(numValue) || !Number.isInteger(numValue)) {
            return 'Must be an integer';
          }
          if (numValue < SETTINGS_CONSTRAINTS.chunkOverlap.min) {
            return `Must be at least ${SETTINGS_CONSTRAINTS.chunkOverlap.min}`;
          }
          const currentChunkSize = parseInt(chunkSizeInput.value) || DEFAULT_SETTINGS.chunkSize;
          if (numValue >= currentChunkSize) {
            return `Must be less than chunk size (${currentChunkSize})`;
          }
          break;

        case 'topK':
          if (isNaN(numValue) || !Number.isInteger(numValue)) {
            return 'Must be an integer';
          }
          if (numValue < SETTINGS_CONSTRAINTS.topK.min || numValue > SETTINGS_CONSTRAINTS.topK.max) {
            return `Must be between ${SETTINGS_CONSTRAINTS.topK.min} and ${SETTINGS_CONSTRAINTS.topK.max}`;
          }
          break;

        case 'temperature':
          if (isNaN(numValue)) {
            return 'Must be a number';
          }
          if (numValue < SETTINGS_CONSTRAINTS.temperature.min || numValue > SETTINGS_CONSTRAINTS.temperature.max) {
            return `Must be between ${SETTINGS_CONSTRAINTS.temperature.min} and ${SETTINGS_CONSTRAINTS.temperature.max}`;
          }
          break;

        case 'maxTokens':
          if (isNaN(numValue) || !Number.isInteger(numValue)) {
            return 'Must be an integer';
          }
          if (numValue < SETTINGS_CONSTRAINTS.maxTokens.min || numValue > SETTINGS_CONSTRAINTS.maxTokens.max) {
            return `Must be between ${SETTINGS_CONSTRAINTS.maxTokens.min} and ${SETTINGS_CONSTRAINTS.maxTokens.max}`;
          }
          break;
      }

      return null; // No error
    }

    function showFieldError(errorElement, message) {
      if (message) {
        errorElement.textContent = message;
        errorElement.classList.add('visible');
      } else {
        errorElement.textContent = '';
        errorElement.classList.remove('visible');
      }
    }

    // Add input validation listeners
    chunkSizeInput.addEventListener('input', () => {
      const error = validateField('chunkSize', chunkSizeInput.value);
      showFieldError(chunkSizeError, error);
      // Re-validate chunk overlap when chunk size changes
      if (!error) {
        const overlapError = validateField('chunkOverlap', chunkOverlapInput.value);
        showFieldError(chunkOverlapError, overlapError);
      }
    });

    chunkOverlapInput.addEventListener('input', () => {
      const error = validateField('chunkOverlap', chunkOverlapInput.value);
      showFieldError(chunkOverlapError, error);
    });

    topKInput.addEventListener('input', () => {
      const error = validateField('topK', topKInput.value);
      showFieldError(topKError, error);
    });

    temperatureInput.addEventListener('input', () => {
      const error = validateField('temperature', temperatureInput.value);
      showFieldError(temperatureError, error);
    });

    maxTokensInput.addEventListener('input', () => {
      const error = validateField('maxTokens', maxTokensInput.value);
      showFieldError(maxTokensError, error);
    });

    // Task 12.5: Save settings
    async function saveSettings() {
      clearMessages();
      clearFieldErrors();

      // Validate all fields before saving
      const errors = {
        chunkSize: validateField('chunkSize', chunkSizeInput.value),
        chunkOverlap: validateField('chunkOverlap', chunkOverlapInput.value),
        topK: validateField('topK', topKInput.value),
        temperature: validateField('temperature', temperatureInput.value),
        maxTokens: validateField('maxTokens', maxTokensInput.value)
      };

      // Show field errors
      showFieldError(chunkSizeError, errors.chunkSize);
      showFieldError(chunkOverlapError, errors.chunkOverlap);
      showFieldError(topKError, errors.topK);
      showFieldError(temperatureError, errors.temperature);
      showFieldError(maxTokensError, errors.maxTokens);

      // If any validation errors, don't submit
      const hasErrors = Object.values(errors).some(err => err !== null);
      if (hasErrors) {
        settingsErrorMessage.textContent = 'Please fix validation errors before saving';
        settingsErrorMessage.classList.add('visible');
        return;
      }

      // Build request body
      const settings = {
        chunkSize: parseInt(chunkSizeInput.value),
        chunkOverlap: parseInt(chunkOverlapInput.value),
        topK: parseInt(topKInput.value),
        temperature: parseFloat(temperatureInput.value),
        maxTokens: parseInt(maxTokensInput.value)
      };

      saveSettingsBtn.disabled = true;
      saveSettingsBtn.textContent = 'Saving...';

      try {
        const response = await fetch('/api/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(settings)
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to save settings');
        }

        const updatedSettings = await response.json();

        // Update inputs with server response (in case server normalized values)
        chunkSizeInput.value = updatedSettings.chunkSize;
        chunkOverlapInput.value = updatedSettings.chunkOverlap;
        topKInput.value = updatedSettings.topK;
        temperatureInput.value = updatedSettings.temperature;
        maxTokensInput.value = updatedSettings.maxTokens;

        settingsSuccessMessage.textContent = 'Settings saved successfully';
        settingsSuccessMessage.classList.add('visible');

        // Hide success message after 3 seconds
        setTimeout(() => {
          settingsSuccessMessage.classList.remove('visible');
        }, 3000);
      } catch (error) {
        console.error('Failed to save settings:', error);
        settingsErrorMessage.textContent = `Save failed: ${error.message}`;
        settingsErrorMessage.classList.add('visible');
      } finally {
        saveSettingsBtn.disabled = false;
        saveSettingsBtn.textContent = 'Save Settings';
      }
    }

    saveSettingsBtn.addEventListener('click', saveSettings);

    // Task 12.6: Reset to defaults
    function resetToDefaults() {
      if (!confirm('Reset all settings to default values?')) {
        return;
      }

      chunkSizeInput.value = DEFAULT_SETTINGS.chunkSize;
      chunkOverlapInput.value = DEFAULT_SETTINGS.chunkOverlap;
      topKInput.value = DEFAULT_SETTINGS.topK;
      temperatureInput.value = DEFAULT_SETTINGS.temperature;
      maxTokensInput.value = DEFAULT_SETTINGS.maxTokens;

      clearMessages();
      clearFieldErrors();

      settingsSuccessMessage.textContent = 'Settings reset to defaults (not saved yet)';
      settingsSuccessMessage.classList.add('visible');

      setTimeout(() => {
        settingsSuccessMessage.classList.remove('visible');
      }, 3000);
    }

    resetSettingsBtn.addEventListener('click', resetToDefaults);
  </script>
</body>
</html>
